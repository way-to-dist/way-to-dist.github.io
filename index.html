<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="طريقك الأسهل للوصول لأي توكيل توزيع ليبتون في مصر">

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Way to Dist">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-512.png">

  <!-- Splash screens for iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Way to Dist</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent iOS bounce scroll */
    html, body {
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }
    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #1D4ED8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #loading img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 20px;
    }
    #loading p {
      color: rgba(255,255,255,0.8);
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Way to Dist">
    <p>جاري التحميل...</p>
  </div>

  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
